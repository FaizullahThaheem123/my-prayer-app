<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#121212">

    <title>Nearby Mosques - My Prayer</title>


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- LEAFLET MAP -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <!-- MASJID CSS -->

    <link
        rel="stylesheet"
        href="masjid.css">
<link rel="stylesheet" href="../theme/theme.css">

    <!-- FIREBASE SDKs -->

    <script
        src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>

</head>


<body>


<div class="masjid-page">


    <!-- ==============================
         HEADER
    =============================== -->

    <header class="masjid-header">

        <div class="header-left">

            <h1>
                <i class="fa-solid fa-mosque"></i>
                Masjid
            </h1>

            <p>
                Find & add nearby mosques
            </p>

        </div>


        <div class="header-right">

            <img
                src="../images/makkah.png"
                alt="Makkah"
                class="header-img">

        </div>

    </header>



    <!-- ==============================
         LOCATION STATUS
    =============================== -->

    <div
        class="location-status"
        id="locationStatus">

        <i class="fa-solid fa-location-dot"></i>

        <span id="locationText">
            Fetching your location...
        </span>

    </div>



    <!-- ==============================
         ACTION BUTTONS
    =============================== -->

    <div class="action-buttons">

        <button
            id="addMosqueBtn"
            class="main-btn">

            <i class="fa-solid fa-plus"></i>

            Add New Mosque

        </button>


        <button
            id="refreshBtn"
            class="secondary-btn">

            <i class="fa-solid fa-rotate"></i>

            Refresh

        </button>

    </div>



    <!-- ==============================
         CITY SEARCH
    =============================== -->

    <div class="search-city-container">

        <input
            type="text"
            id="citySearch"
            placeholder="Search by city (e.g. Makkah, Lahore)..."
            class="city-search-input">


        <button
            id="searchCityBtn"
            class="city-search-btn">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

    </div>



    <!-- ==============================
         MAP
    =============================== -->

    <div
        id="mapContainer"
        class="map-container">
    </div>



    <!-- ==============================
         MOSQUE LIST
    =============================== -->

    <div
        id="mosqueList"
        class="mosque-list">

        <div class="loading-msg">
            Loading mosques...
        </div>

    </div>



    <!-- ==============================
         ADD / EDIT MODAL
    =============================== -->

    <div
        id="addModal"
        class="modal">


        <div class="modal-content">


            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Mosque
                </h2>


                <button
                    class="close-modal"
                    id="closeModalBtn"
                    type="button"
                    aria-label="Close">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>



            <form id="addMosqueForm">


                <!-- MOSQUE NAME -->

                <div class="form-group">

                    <label>
                        Mosque Name *
                    </label>

                    <input
                        type="text"
                        id="mosqueName"
                        required
                        placeholder="e.g. Faisal Mosque">

                </div>



                <!-- ADDRESS -->

                <div class="form-group">

                    <label>
                        Address *
                    </label>

                    <input
                        type="text"
                        id="mosqueAddress"
                        required
                        placeholder="Street, City, Country">

                </div>



                <!-- USER NAME -->

                <div class="form-group">

                    <label>
                        Your Name *
                    </label>

                    <input
                        type="text"
                        id="userName"
                        required
                        placeholder="Enter your full name">

                </div>



                <!-- FATHER NAME -->

                <div class="form-group">

                    <label>
                        Your Father's Name *
                    </label>

                    <input
                        type="text"
                        id="fatherName"
                        required
                        placeholder="Enter your father's name">

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Your Phone Number *
                    </label>

                    <input
                        type="tel"
                        id="phoneNumber"
                        required
                        placeholder="03XX-XXXXXXX">

                </div>



                <!-- OTP -->

                <div class="otp-section">


                    <div class="otp-row">

                        <input
                            type="text"
                            id="otpInput"
                            placeholder="Enter 4-digit OTP"
                            maxlength="4"
                            disabled>


                        <button
                            type="button"
                            id="sendOtpBtn"
                            class="otp-btn">

                            Send Code

                        </button>

                    </div>


                    <button
                        type="button"
                        id="verifyOtpBtn"
                        class="verify-btn">

                        Verify OTP

                    </button>


                    <span
                        id="otpStatus"
                        class="otp-status">
                    </span>

                </div>



                <!-- PHOTO -->

                <div class="form-group">

                    <label>
                        Upload Photo (optional)
                    </label>

                    <input
                        type="file"
                        id="mosquePhoto"
                        accept="image/*">

                    <small>
                        Max 1MB
                    </small>

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                    disabled>

                    Save Mosque

                </button>


            </form>

        </div>

    </div>



    <!-- ==============================
         TOAST
    =============================== -->

    <div
        id="toast"
        class="toast">
    </div>



    <!-- ==============================
         BOTTOM NAVIGATION
    =============================== -->

    <nav class="bottom-nav">


        <a
            href="../index.html"
            class="nav-home">

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>



        <div class="more-nav">


            <button
                type="button"
                class="more-nav-btn active"
                id="moreNavBtn">

                <i class="fa-solid fa-ellipsis"></i>

                <span>
                    More
                </span>

            </button>



            <div
                class="more-menu"
                id="moreMenu">


                <a href="../quran/quran.html">

                    <i class="fa-solid fa-book-quran"></i>

                    <span>
                        Quran
                    </span>

                </a>


                <a href="../dua/duas.html">

                    <i class="fa-solid fa-hands-praying"></i>

                    <span>
                        Duas
                    </span>

                </a>


                <a href="../names/names.html">

                    <i class="fa-solid fa-star-and-crescent"></i>

                    <span>
                        99 Names
                    </span>

                </a>


                <a href="../tasbeeh/tasbeeh.html">

                    <i class="fa-solid fa-ring"></i>

                    <span>
                        Tasbeeh
                    </span>

                </a>


                <a href="../campus/campus.html">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <span>
                        Campus
                    </span>

                </a>


                <a
                    href="masjid.html"
                    class="active">

                    <i class="fa-solid fa-mosque"></i>

                    <span>
                        Masjid
                    </span>

                </a>


                <button
                    type="button"
                    id="settingsBtn">

                    <i class="fa-solid fa-gear"></i>

                    <span>
                        Settings
                    </span>

                </button>


            </div>

        </div>


    </nav>


</div>



<!-- ==============================
     LEAFLET JS
================================ -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- ==============================
     MASJID JS
================================ -->

<script src="masjid.js"></script>
<script src="../theme/theme.js"></script>

</body>

</html>
