<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prayer | Daily Duas</title>
    <link rel="stylesheet" href="duas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="app">

    <section class="duas-screen">

        <div class="duas-container">

            <!-- ==================================
                 HEADER (Title Left, Image Right)
            =================================== -->
            <div class="duas-header">
                <!-- TITLE -->
                <div class="duas-header-title">
                    <h1>🤲 Daily Duas</h1>
                    <p>Read authentic daily duas</p>
                </div>

                <!-- DUA IMAGE (same folder) -->
                <div class="duas-header-image">
                    <img src="dua.jpg" alt="Dua">
                </div>
            </div>

            <!-- ==================================
                 SEARCH
            =================================== -->
            <div class="duas-search" onclick="closeMoreMenu()">
                <input type="text" id="duaSearch" placeholder="🔍 Search Dua..." onkeyup="searchDua()" autocomplete="off">
            </div>

            <!-- ==================================
                 CATEGORIES
            =================================== -->
            <div class="dua-categories">
                <button type="button" onclick="showCategory('favorite')">
                    ⭐ Favorite <span id="favoriteCount"></span>
                </button>
                <button type="button" onclick="showCategory('all')">All</button>
                <button type="button" onclick="showCategory('protection')">Protection</button>
                <button type="button" onclick="showCategory('daily')">Daily</button>
                <button type="button" onclick="showCategory('travel')">Travel</button>
            </div>

            <!-- ==================================
                 DUA LIST
            =================================== -->
            <div id="duaList"></div>

        </div>

        <!-- ======================================
             FULL DUA READER
        ======================================= -->
        <div id="duaReader" class="dua-reader">

            <div class="reader-header">
                <button class="reader-close" type="button" onclick="closeReader()">✕</button>
                <button class="reader-fav" id="readerFavBtn" type="button" onclick="toggleCurrentFavorite()">🤍</button>
            </div>

            <div class="reader-content">
                <h2 id="readerTitle"></h2>

                <!-- AUDIO -->
                <div class="dua-audio-player">
                    <button id="duaAudioBtn" type="button" onclick="toggleDuaAudio()">▶️</button>
                    <div class="dua-audio-info">
                        <span id="duaAudioStatus">Play Audio</span>
                        <div class="dua-audio-progress">
                            <div id="duaAudioProgressFill"></div>
                        </div>
                    </div>
                </div>

                <audio id="duaAudio"></audio>

                <p id="readerArabic" class="dua-arabic"></p>
                <p id="readerMeaning" class="dua-meaning"></p>
                <p id="readerUrdu" class="dua-urdu"></p>
                <span id="readerReference" class="dua-reference"></span>
            </div>

            <div class="reader-bottom">
                <button type="button" onclick="previousDua()">⬅ Previous</button>
                <span id="readerCount">1 / 1</span>
                <button type="button" onclick="nextDua()">Next ➡</button>
            </div>

        </div>

    </section>

    <!-- ======================================
         BOTTOM NAV (ONLY HOME + MORE)
    ======================================= -->
    <nav class="bottom-nav">

        <!-- HOME -->
        <a href="../index.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <!-- MORE -->
        <div class="more-nav">
            <button type="button" class="more-nav-btn" onclick="toggleMoreMenu()">
                <i class="fa-solid fa-ellipsis"></i>
                <span>More</span>
            </button>

            <div id="moreMenu" class="more-menu">
                <a href="../quran/quran.html">
                    <i class="fa-solid fa-book-quran"></i>
                    <span>Quran</span>
                </a>
                <a href="duas.html" class="active">
                    <i class="fa-solid fa-hands-praying"></i>
                    <span>Duas</span>
                </a>
                <a href="../names/names.html">
                    <i class="fa-solid fa-star-and-crescent"></i>
                    <span>99 Names</span>
                </a>
                <a href="../tasbeeh/tasbeeh.html">
                    <i class="fa-solid fa-ring"></i>
                    <span>Tasbeeh</span>
                </a>
                <a href="../campus/campus.html">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Campus</span>
                </a>
                <a href="../masjid/masjid.html"><i class="fa-solid fa-mosque"></i><span>Masjid</span></a>
                <!-- نیا Settings بٹن -->
                <button type="button" onclick="toggleDuaSettings()">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </button>
            </div>
        </div>

    </nav>
    
    <script src="duas.js"></script>

</div>

</body>
</html>
