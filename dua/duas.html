<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Prayer | Daily Duas</title>

    <!-- DUAS CSS -->
    <link rel="stylesheet" href="duas.css">

<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="app">


    <!-- ======================================
         DUAS SCREEN
    ======================================= -->

    <section class="duas-screen">


        <div class="duas-container">


            <!-- ==================================
                 HEADER
            =================================== -->

            <div class="duas-header">


                <button
                    class="duas-header-btn"
                    type="button"
                    onclick="goHome()"
                    aria-label="Home">

                    🏠

                </button>


                <div class="duas-header-title">

                    <h1>
                        🤲 Daily Duas
                    </h1>

                    <p>
                        Read authentic daily duas
                    </p>

                </div>


                <button
                    class="duas-header-btn"
                    type="button"
                    onclick="toggleDuaSettings()"
                    aria-label="Dua Settings">

                    ⚙️

                </button>


            </div>



            <!-- ==================================
                 THEME PANEL
            =================================== -->

            <div
                id="duaThemePanel"
                class="dua-themes"
                style="display:none;">

                <button
                    type="button"
                    onclick="changeDuaTheme('gold')"
                    aria-label="Gold Theme">

                    🟡

                </button>


                <button
                    type="button"
                    onclick="changeDuaTheme('green')"
                    aria-label="Green Theme">

                    🟢

                </button>


                <button
                    type="button"
                    onclick="changeDuaTheme('teal')"
                    aria-label="Teal Theme">

                    🔵

                </button>


                <button
                    type="button"
                    onclick="changeDuaTheme('purple')"
                    aria-label="Purple Theme">

                    🟣

                </button>


            </div>



            <!-- ==================================
                 SEARCH
            =================================== -->

            <div class="duas-search">

                <input
                    type="text"
                    id="duaSearch"
                    placeholder="🔍 Search Dua..."
                    onkeyup="searchDua()"
                    autocomplete="off">

            </div>



            <!-- ==================================
                 CATEGORIES
            =================================== -->

            <div class="dua-categories">


                <button
                    type="button"
                    onclick="showCategory('favorite')">

                    ⭐ Favorite

                    <span id="favoriteCount"></span>

                </button>


                <button
                    type="button"
                    onclick="showCategory('all')">

                    All

                </button>


                <button
                    type="button"
                    onclick="showCategory('protection')">

                    Protection

                </button>


                <button
                    type="button"
                    onclick="showCategory('daily')">

                    Daily

                </button>


                <button
                    type="button"
                    onclick="showCategory('travel')">

                    Travel

                </button>


            </div>



            <!-- ==================================
                 DUA LIST
            =================================== -->

            <div id="duaList">

                <!--
                    Duas JavaScript se
                    automatically load hongi.
                -->

            </div>


        </div>



        <!-- ======================================
             FULL DUA READER
        ======================================= -->

        <div
            id="duaReader"
            class="dua-reader">


            <!-- ==================================
                 READER HEADER
            =================================== -->

            <div class="reader-header">


                <button
                    class="reader-close"
                    type="button"
                    onclick="closeReader()"
                    aria-label="Close">

                    ✕

                </button>


                <button
                    class="reader-fav"
                    id="readerFavBtn"
                    type="button"
                    onclick="toggleCurrentFavorite()"
                    aria-label="Favorite">

                    🤍

                </button>


            </div>



            <!-- ==================================
                 READER CONTENT
            =================================== -->

            <div class="reader-content">


                <h2 id="readerTitle"></h2>


                <p
                    id="readerArabic"
                    class="dua-arabic">
                </p>


                <p
                    id="readerMeaning"
                    class="dua-meaning">
                </p>


                <p
                    id="readerUrdu"
                    class="dua-urdu">
                </p>


                <span
                    id="readerReference"
                    class="dua-reference">
                </span>


            </div>



            <!-- ==================================
                 READER BOTTOM
            =================================== -->

            <div class="reader-bottom">


                <button
                    type="button"
                    onclick="previousDua()">

                    ⬅ Previous

                </button>


                <span id="readerCount">

                    1 / 1

                </span>


                <button
                    type="button"
                    onclick="nextDua()">

                    Next ➡

                </button>


            </div>


        </div>


    </section>



<!-- ======================================
     BOTTOM NAVIGATION
====================================== -->

    <a

        <i class="fa-solid fa-house"></i>

    </a>


    <!-- DUAS -->

        </span>

    </a>


    <!-- 99 NAMES -->

    <a

        <i class="fa-solid fa-star-and-crescent"></i>

        <span>
            99 Names
        </span>

    </a>


    <!-- TASBEEH -->

    <a
        href="../tasbeeh/tasbeeh.html">

        <i class="fa-solid fa-ring"></i>

        <span>
            Tasbeeh
        </span>

    </a>


    <!-- CAMPUS -->

    <a
        href="../campus/campus.html">

        <i class="fa-solid fa-graduation-cap"></i>

        <span>
            Campus
        </span>

    </a>


</nav>

======================================= -->

</body>

</html>
