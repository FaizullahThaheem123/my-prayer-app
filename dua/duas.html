<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Prayer | Daily Duas</title>
    <link rel="stylesheet" href="duas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
 <!-- THEME CSS -->
    <link
        rel="stylesheet"
        href="../theme/theme.css">
<script>
(function () {
    const savedTheme = localStorage.getItem("appTheme");
    const colors = {
        gold: "#d4af37", "royal-blue": "#1565c0", emerald: "#00897b", forest: "#1b5e20", navy: "#0d47a1", violet: "#7b1fa2", wine: "#880e4f", olive: "#33691e", ruby: "#c62828", orange: "#e65100", teal: "#00838f", pink: "#c2185b", sky: "#0288d1", lime: "#827717", copper: "#b87333", silver: "#9e9e9e", cyan: "#00bcd4", indigo: "#283593", brown: "#4e342e", crimson: "#dc143c", coral: "#ff6f61", peach: "#ffb74d", mint: "#4dd0e1", lavender: "#ba68c8", burgundy: "#800020", mustard: "#ffdb58", sage: "#8a9a5b", stone: "#607d8b", cobalt: "#0047ab", turquoise: "#00ced1", chocolate: "#d2691e", plum: "#8e4585", slate: "#708090", amber: "#ffbf00", fuchsia: "#ff00ff", aqua: "#00ffff", magenta: "#ff00a0", periwinkle: "#ccccff", jade: "#00a86b", sand: "#c2b280", rust: "#b7410e", charcoal: "#36454f", cream: "#fffdd0", "rose-gold": "#b76e79", steel: "#4682b4", mahogany: "#c04000", cardinal: "#c41e3a", maroon: "#800000", chartreuse: "#7fff00", "neon-blue": "#1f51ff"
    };
    if (savedTheme && colors[savedTheme]) {
        document.documentElement.style.setProperty("--primary", colors[savedTheme]);
    }
})();
</script>
</head>

<body>

<div class="app">

    <section class="duas-screen">

        <div class="duas-container">

            <!-- ==================================
                 HEADER (Title Left, Icon Right)
            =================================== -->
            <div class="duas-header">
                <div class="duas-header-title">
                    <h1> Daily Duas</h1>
                    <p>Authentic duas with online audio & offline download</p>
                </div>

                <div class="duas-header-image">
                    <i class="fa-solid fa-hands-praying" style="color: var(--primary); font-size: 20px;"></i>
                </div>
            </div>

            <!-- ==================================
                 SEARCH BAR
            =================================== -->
            <div class="duas-search">
                <input type="text" id="duaSearch" placeholder="🔍 Search Dua (Ayatul Kursi, Peace, Rizq, توبہ)..." onkeyup="searchDua()" autocomplete="off">
            </div>

            <!-- ==================================
                 CATEGORIES
            =================================== -->
            <div class="dua-categories">
                <button type="button" class="cat-btn active" onclick="showCategory('all')">All</button>
                <button type="button" class="cat-btn" onclick="showCategory('favorite')">⭐ Favorite <span id="favoriteCount"></span></button>
                <button type="button" class="cat-btn" onclick="showCategory('peace')">🕊️ Peace & Anxiety</button>
                <button type="button" class="cat-btn" onclick="showCategory('protection')">🛡️ Protection</button>
                <button type="button" class="cat-btn" onclick="showCategory('daily')">🌅 Morning & Daily</button>
                <button type="button" class="cat-btn" onclick="showCategory('forgiveness')">🤲 Forgiveness</button>
                <button type="button" class="cat-btn" onclick="showCategory('healing')">🌿 Health & Shifa</button>
                <button type="button" class="cat-btn" onclick="showCategory('sustenance')">💰 Rizq</button>
                <button type="button" class="cat-btn" onclick="showCategory('quranic')">📖 Rabbana</button>
                <button type="button" class="cat-btn" onclick="showCategory('family')">👨‍👩‍👧 Parents</button>
                <button type="button" class="cat-btn" onclick="showCategory('sleep')">🌙 Sleep</button>
                <button type="button" class="cat-btn" onclick="showCategory('travel')">🚗 Travel</button>
            </div>

            <!-- ==================================
                 DUA LIST
            =================================== -->
            <div id="duaList"></div>

        </div>

        <!-- ======================================
             FULL DUA READER MODAL
        ======================================= -->
        <div id="duaReader" class="dua-reader">

            <div class="reader-header">
                <button class="reader-close" type="button" onclick="closeReader()" title="Close">✕</button>
                <div class="reader-title-header">
                    <span id="readerCategoryBadge" class="reader-category-badge">DAILY</span>
                </div>
                <button class="reader-fav" id="readerFavBtn" type="button" onclick="toggleCurrentFavorite()" title="Favorite">🤍</button>
            </div>

            <div class="reader-content">
                <h2 id="readerTitle"></h2>
                <h3 id="readerTitleUrdu" class="reader-title-urdu"></h3>

                <!-- AUDIO PLAYER & DOWNLOAD SECTION -->
                <div class="dua-audio-player">
                    <button id="duaAudioBtn" type="button" onclick="toggleDuaAudio()" title="Play / Pause">▶</button>
                    
                    <div class="dua-audio-info">
                        <div class="dua-audio-top">
                            <span id="duaAudioStatus">Online Recitation</span>
                            <span id="duaAudioTime">0:00 / 0:00</span>
                        </div>
                        <div class="dua-audio-progress" onclick="seekDuaAudio(event)">
                            <div id="duaAudioProgressFill"></div>
                        </div>
                    </div>

                    <!-- DOWNLOAD MP3 BUTTON -->
                    <button id="duaDownloadBtn" type="button" class="btn-download" onclick="downloadCurrentDuaAudio()" title="Download MP3 for Offline Listening">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>

                <audio id="duaAudio" preload="auto"></audio>

                <!-- ARABIC TEXT -->
                <p id="readerArabic" class="dua-arabic"></p>

                <!-- TRANSLITERATION -->
                <p id="readerTransliteration" class="dua-transliteration"></p>

                <!-- URDU TRANSLATION -->
                <div class="translation-box urdu-box">
                    <span class="box-label">اردو ترجمہ</span>
                    <p id="readerUrdu" class="dua-urdu"></p>
                </div>

                <!-- ENGLISH TRANSLATION -->
                <div class="translation-box english-box">
                    <span class="box-label">English Translation</span>
                    <p id="readerMeaning" class="dua-meaning"></p>
                </div>

                <!-- VIRTUES & BENEFITS -->
                <div id="readerVirtuesBox" class="virtues-box">
                    <span class="box-label">✨ فضیلت و برکت</span>
                    <p id="readerVirtues" class="dua-virtues"></p>
                </div>

                <span id="readerReference" class="dua-reference"></span>
            </div>

            <div class="reader-bottom">
                <button type="button" id="prevBtn" onclick="previousDua()">⬅ Previous</button>
                <span id="readerCount">1 / 1</span>
                <button type="button" id="nextBtn" onclick="nextDua()">Next ➡</button>
            </div>

        </div>

    </section>

           <!-- ======================================
         BOTTOM NAV (HOME | DUAS | FAV | SAKOON | MORE)
    ======================================= -->
    <nav class="bottom-nav">
        
        <!-- 1. HOME -->
        <a href="../index.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <!-- 2. DUAS (Active) -->
        <a href="duas.html" class="active">
            <i class="fa-solid fa-hands-praying"></i>
            <span>Duas</span>
        </a>

        <!-- 3. FAVORITES -->
        <a href="javascript:void(0)" onclick="showCategory('favorite')">
            <i class="fa-solid fa-heart"></i>
            <span>Favorites</span>
        </a>

        <!-- 4. SAKOON (PEACE) -->
        <a href="javascript:void(0)" onclick="showCategory('peace')">
            <i class="fa-solid fa-dove"></i>
            <span>Sakoon</span>
        </a>

               <!-- 5. MORE (Bottom Sheet) -->
        <div class="more-nav">
            <button type="button" class="more-nav-btn" id="moreNavBtn">
                <i class="fa-solid fa-ellipsis"></i>
                <span>More</span>
            </button>

            <!-- Overlay -->
            <div class="more-overlay" id="moreOverlay"></div>

            <!-- Bottom Sheet -->
            <div class="more-sheet" id="moreSheet">
                <div class="sheet-handle"></div>
                <div class="sheet-header">
                    <span class="sheet-title">All Features</span>
                    <button type="button" class="sheet-close" id="moreSheetClose">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="more-grid">
                    <a href="../quran/quran.html"><i class="fa-solid fa-book-quran"></i><span>Quran</span></a>
                    <a href="../names/names.html"><i class="fa-solid fa-star-and-crescent"></i><span>99 Names</span></a>
                    <a href="../tasbeeh/tasbeeh.html"><i class="fa-solid fa-ring"></i><span>Tasbeeh</span></a>
                    <a href="../campus/campus.html"><i class="fa-solid fa-graduation-cap"></i><span>Campus</span></a>
                    <a href="../masjid/masjid.html"><i class="fa-solid fa-mosque"></i><span>Masjid</span></a>
                    <a href="../zakat/zakat.html"><i class="fa-solid fa-hand-holding-heart"></i><span>Zakat</span></a>
                    <a href="../calendar/calendar.html"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
                    <a href="../age/age.html"><i class="fa-solid fa-cake-candles"></i><span>Age</span></a>
                    <a href="../namaz guide/namaz guide.html"><i class="fa-solid fa-person-praying"></i><span>Namaz Guide</span></a>
                    <button type="button" id="settingsBtn"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
                </div>
            </div>
        </div>

<script src="duas.js"></script>
<script src="../theme/theme.js"></script>
</body>
</html>
