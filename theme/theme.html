<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Themes - My Prayer</title>
    <link rel="stylesheet" href="theme.css">
     <script>
        (function() {
            const savedTheme = localStorage.getItem("appTheme");
            const themeColors = {
                "gold": "#d4af37",
                "royal-blue": "#1565c0",
                "emerald": "#00897b",
                "forest": "#1b5e20",
                "navy": "#0d47a1",
                "violet": "#7b1fa2",
                "wine": "#880e4f",
                "olive": "#33691e",
                "ruby": "#c62828",
                "orange": "#e65100",
                "teal": "#00838f",
                "pink": "#c2185b",
                "sky": "#0288d1",
                "lime": "#827717",
                "copper": "#b87333",
                "silver": "#9e9e9e",
                "cyan": "#00bcd4",
                "indigo": "#283593",
                "brown": "#4e342e",
                "crimson": "#dc143c",
                "coral": "#ff6f61",
                "peach": "#ffb74d",
                "mint": "#4dd0e1",
                "lavender": "#ba68c8",
                "burgundy": "#800020",
                "mustard": "#ffdb58",
                "sage": "#8a9a5b",
                "stone": "#607d8b",
                "cobalt": "#0047ab",
                "turquoise": "#00ced1",
                "chocolate": "#d2691e",
                "plum": "#8e4585",
                "slate": "#708090",
                "amber": "#ffbf00",
                "fuchsia": "#ff00ff",
                "aqua": "#00ffff",
                "magenta": "#ff00a0",
                "periwinkle": "#ccccff",
                "jade": "#00a86b",
                "sand": "#c2b280",
                "rust": "#b7410e",
                "charcoal": "#36454f",
                "cream": "#fffdd0",
                "rose-gold": "#b76e79",
                "steel": "#4682b4",
                "mahogany": "#c04000",
                "cardinal": "#c41e3a",
                "maroon": "#800000",
                "chartreuse": "#7fff00",
                "neon-blue": "#1f51ff"
            };
            if (savedTheme && themeColors[savedTheme]) {
                document.documentElement.style.setProperty("--primary", themeColors[savedTheme]);
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="themes-page">

    <div class="themes-app">
        <div class="themes-header">
            <button class="back-btn" onclick="window.history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1><i class="fa-solid fa-palette"></i> Designs</h1>
            <div style="width:24px;"></div>
        </div>

        <!-- THEME GRID -->
        <div id="themeGrid" class="theme-grid"></div>
    </div>

    <!-- THEME JAVASCRIPT -->
    <script src="theme.js"></script>
    
</body>
</html>
