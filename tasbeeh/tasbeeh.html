<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Tasbeeh | My Prayer</title>

<link rel="stylesheet" href="tasbeeh.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="tasbeeh-app">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="tasbeeh-header">

        <button id="homeBtn" class="header-btn">
            <i class="fa-solid fa-house"></i>
        </button>

        <div class="header-title">

            <h1>
                <i class="fa-solid fa-ring"></i>
                Digital Tasbeeh
            </h1>

            <p>
                Count your Dhikr with focus and peace
            </p>

        </div>

        <button id="settingsBtn" class="header-btn">
            <i class="fa-solid fa-gear"></i>
        </button>

    </header>



    <!-- ========================= -->
    <!-- DHIKR SECTION -->
    <!-- ========================= -->

    <section class="dhikr-section">

        <select id="dhikrSelect">

            <option value="bismillah">
                Bismillah
            </option>

            <option value="subhanallah">
                SubhanAllah
            </option>

            <option value="alhamdulillah">
                Alhamdulillah
            </option>

            <option value="allahuakbar">
                Allahu Akbar
            </option>

            <option value="astaghfirullah">
                Astaghfirullah
            </option>

            <option value="lailahaillallah">
                La ilaha illallah
            </option>

        </select>

        <h2 id="arabicDhikr">

            بِسْمِ اللهِ

        </h2>

    </section>

        <!-- ========================= -->
    <!-- TARGET BUTTONS -->
    <!-- ========================= -->

    <section class="target-section">

        <button class="target-btn active" data-target="33">
            33
        </button>

        <button class="target-btn" data-target="99">
            99
        </button>

        <button class="target-btn" data-target="100">
            100
        </button>

    </section>



    <!-- ========================= -->
<!-- INFO CIRCLES -->
<!-- ========================= -->

<section class="info-section">

    <!-- Target -->
    <div class="info-card">

        <span class="info-label">
            Target
        </span>

        <span id="targetValue" class="info-value">
            33
        </span>

    </div>

    <!-- Count -->
    <div class="info-card count-card">

        <span class="info-label">
            Count
        </span>

        <span id="countValue" class="info-value">
            0
        </span>

    </div>

    <!-- Progress -->
    <div class="info-card">

        <span class="info-label">
            Progress
        </span>

        <span id="progressValue" class="info-value">
            0%
        </span>

    </div>

</section>



   

        <!-- ========================= -->
    <!-- PROGRESS BAR -->
    <!-- ========================= -->

    <section class="progress-section">

        <div class="progress-track">

            <div id="progressBar" class="progress-fill"></div>

        </div>

    </section>



    <!-- ========================= -->
    <!-- STATISTICS -->
    <!-- ========================= -->

    <section class="stats-section">

        <div class="stat-card">

            <span class="stat-number" id="completed33">
                0
            </span>

            <span class="stat-title">
                ×33
            </span>

        </div>


        <div class="stat-card">

            <span class="stat-number" id="completed99">
                0
            </span>

            <span class="stat-title">
                ×99
            </span>

        </div>


        <div class="stat-card">

            <span class="stat-number" id="completed100">
                0
            </span>

            <span class="stat-title">
                ×100
            </span>

        </div>

    </section>



    <!-- ========================= -->
    <!-- ACTION BUTTONS -->
    <!-- ========================= -->

    <section class="action-section">

        <button id="countBtn" class="count-btn">

            <i class="fa-solid fa-hand-pointer"></i>

            TAP TO COUNT

        </button>


        <button id="resetBtn" class="reset-btn">

            <i class="fa-solid fa-rotate-left"></i>

            RESET

        </button>

    </section>



    <!-- ========================= -->
    <!-- BOTTOM NAVIGATION -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <a href="../index.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="../quran/quran.html">
            <i class="fa-solid fa-book-quran"></i>
            <span>Quran</span>
        </a>

        <a href="../dua/duas.html">
            <i class="fa-solid fa-hands-praying"></i>
            <span>Duas</span>
        </a>

        <a href="tasbeeh.html" class="active">
            <i class="fa-solid fa-ring"></i>
            <span>Tasbeeh</span>
        </a>

    </nav>

</div>

<script src="tasbeeh.js"></script>

</body>
</html>
